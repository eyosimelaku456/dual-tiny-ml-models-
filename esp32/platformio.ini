; ============================================================
; platformio.ini - PlatformIO Build Configuration for ESP32
; ============================================================
; TinyML Battery SOH Estimator
; Target: ESP32 DevKit v1
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Partition scheme supporting >1MB app
board_build.partitions = huge_app.csv

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O2
    -std=gnu++17

; TensorFlow Lite for Microcontrollers ESP32 library
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0

; Serial monitor
monitor_speed = 115200

; Upload speed
upload_speed = 921600
upload_port = COM3
monitor_port = COM3
